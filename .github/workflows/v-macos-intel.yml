name: Vendored macOS x86_64
on:
  pull_request:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '**/README.md'
      - '**/.gitignore'
      - '**/*.sh'
jobs:
  test:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: install dependencies
        run: |
          brew install llvm
      - run: rustup component add rustfmt
      - name: cargo test
        run: cargo test --features=vendored
