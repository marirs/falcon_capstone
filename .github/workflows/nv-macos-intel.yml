name: Non-Vendored macOS x86_64
on:
  pull_request:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '**/README.md'
      - '**/.gitignore'
      - '**/*.sh'
jobs:
  test:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - name: install dependencies
        run: |
          brew install llvm capstone
          CAPSTONE_PREFIX=$(brew --prefix capstone)
          echo "CPATH=$CAPSTONE_PREFIX/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$CAPSTONE_PREFIX/lib" >> "$GITHUB_ENV"
          echo "CAPSTONE_INCLUDE_DIR=$CAPSTONE_PREFIX/include" >> "$GITHUB_ENV"
          echo "CAPSTONE_LIBRARY_PATH=$CAPSTONE_PREFIX/lib" >> "$GITHUB_ENV"
      - run: rustup component add rustfmt
      - name: cargo test
        run: cargo test
