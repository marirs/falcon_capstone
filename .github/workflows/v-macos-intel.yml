name: Vendored macOS x86_64
on:
  pull_request:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '**/README.md'
      - '**/.gitignore'
      - '**/*.sh'
jobs:
  test:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: install dependencies
        run: |
          brew install llvm
          python3 -m venv "$RUNNER_TEMP/cmake3"
          "$RUNNER_TEMP/cmake3/bin/pip" install "cmake>=3.28,<4"
          echo "$RUNNER_TEMP/cmake3/bin" >> "$GITHUB_PATH"
      - run: rustup component add rustfmt
      - name: cargo test
        run: cargo test --features=vendored
